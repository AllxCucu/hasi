name: RHVoice

# Builds RHVoice.dll (x64) from a pinned upstream commit, with the voice Paul and the Romanian language data from
# the same commit, checks that it speaks, and keeps it as an artifact (ADR 0004, phase 0.11 step 1).
# The corresponding source is upstream RHVoice at RHVOICE_COMMIT plus this file.

on:
  push:
    paths:
      - .github/workflows/rhvoice.yml
      - tools/RhVoiceCheck/**
  workflow_dispatch:

permissions:
  contents: read

env:
  RHVOICE_TAG: 1.18.4
  RHVOICE_COMMIT: fa9dd196fd2dac3b0bf089a2d80fc8477c2380e3
  SCONS_VERSION: 4.11.1
  LXML_VERSION: 6.1.3
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Data files must stay byte for byte as upstream has them (no CRLF conversion).
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Check out RHVoice at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: RHVoice/RHVoice
          ref: ${{ env.RHVOICE_COMMIT }}
          path: rhvoice-src
          submodules: false

      - name: Fetch only the submodules the library and Paul need
        working-directory: rhvoice-src
        shell: pwsh
        run: |
          $paths = git config -f .gitmodules --get-regexp 'submodule\..*\.path' |
            ForEach-Object { ($_ -split ' ')[1] } |
            Where-Object { $_ -like 'external/libs/boost/*' -or $_ -in 'data/languages/Romanian', 'data/voices/paul', 'src/scripts/Romanian' }
          "Submodules: $($paths.Count)"
          git submodule update --init --depth 1 --jobs 8 -- @paths
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons==${{ env.SCONS_VERSION }} lxml==${{ env.LXML_VERSION }}

      - name: Build only the x64 library
        working-directory: rhvoice-src
        shell: pwsh
        run: |
          # SCons reads upstream's installer scripts even when only the library is asked for. Without
          # sapi_dev_core they stop with an error; the flag only changes upstream's SAPI installers, never
          # RHVoice.dll. Only the DLL target is built.
          scons -j4 languages=romanian sapi_dev_core=true build/windows/x86_64/lib/RHVoice.dll
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Show what was built
        if: always()
        working-directory: rhvoice-src
        shell: pwsh
        run: Get-ChildItem build/windows -Recurse -Include *.dll, *.lib | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Assemble the RHVoice folder
        shell: pwsh
        run: |
          $src = 'rhvoice-src'
          $out = 'out/rhvoice'
          New-Item -ItemType Directory -Force "$out/lib/x64", "$out/paul-data", "$out/paul-langdata", "$out/licenses" | Out-Null
          Copy-Item "$src/build/windows/x86_64/lib/RHVoice.dll" "$out/lib/x64/"
          Copy-Item "$src/data/voices/paul/*" "$out/paul-data/" -Recurse -Exclude .git
          Copy-Item "$src/data/languages/Romanian/*" "$out/paul-langdata/" -Recurse -Exclude .git, '*.bak_*'
          Copy-Item "$src/LICENSE.md" "$out/licenses/RHVoice-LICENSE-GPL-2.0.md"
          Copy-Item "$src/licenses/gpl-3.0.txt", "$src/licenses/by-sa-4.0.txt" "$out/licenses/"
          # Some library files are LGPL-2.1-or-later or LGPL-3.0-or-later; upstream ships no LGPL text.
          Invoke-WebRequest https://www.gnu.org/licenses/lgpl-2.1.txt -OutFile "$out/licenses/lgpl-2.1.txt"
          Invoke-WebRequest https://www.gnu.org/licenses/lgpl-3.0.txt -OutFile "$out/licenses/lgpl-3.0.txt"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check that the build speaks
        shell: pwsh
        run: |
          dotnet run --project tools/RhVoiceCheck -c Release -- out/rhvoice src/Hasi.App/Resources/ro.json out/samples |
            Tee-Object -FilePath out/check.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Write BUILD-INFO.txt
        shell: pwsh
        run: |
          $dll = 'out/rhvoice/lib/x64/RHVoice.dll'
          $reported = (Select-String -Path out/check.txt -Pattern '^version\s+(.+)$').Matches[0].Groups[1].Value
          @(
            "RHVoice $env:RHVOICE_TAG, commit $env:RHVOICE_COMMIT"
            "Built by HASI's CI from upstream source; the DLL is distributed under GPL-3.0-or-later (see licenses/)."
            "Source: https://github.com/RHVoice/RHVoice/tree/$env:RHVOICE_COMMIT"
            "The library reports version '$reported': upstream's SConstruct (get_version) returns that string at every 1.18.x tag. The source is tag $env:RHVOICE_TAG."
            "RHVoice.dll SHA-256: $((Get-FileHash $dll -Algorithm SHA256).Hash)"
            "Voice Paul and Romanian data: submodules data/voices/paul and data/languages/Romanian at that commit"
            "Built with: SCons $env:SCONS_VERSION, runner image $env:ImageOS $env:ImageVersion"
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Encoding utf8 out/rhvoice/BUILD-INFO.txt
          Get-Content out/rhvoice/BUILD-INFO.txt

      - uses: actions/upload-artifact@v7
        with:
          name: rhvoice-x64
          path: out/rhvoice

      - uses: actions/upload-artifact@v7
        with:
          name: rhvoice-samples
          path: out/samples/*.wav
